<style>
:root{
  --bg:#E8EDF2; --paper:#F7F9FB; --ink:#17233B; --mute:#55657D; --line:#C5CFDB; --seal:#9B2D3A;
  --ra:#9B2D3A; --rb:#2F5D8A; --rc:#5E7F3E; --rd:#A67C2E; --re:#6B4E9B; --rf:#2E7F7A; --rg:#7A6A5A;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1626; --paper:#162036; --ink:#E4E9F1; --mute:#9AA8BF; --line:#2A3752; --seal:#E58A94;
    --ra:#E58A94; --rb:#7FB0E0; --rc:#9CC27A; --rd:#D9B56A; --re:#B49AE0; --rf:#6FC7C0; --rg:#B8A898;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.7 "PT Serif",Georgia,"Times New Roman",serif}
.top{display:flex;justify-content:flex-end;gap:.25rem;padding:1rem 1.25rem 0;max-width:1080px;margin:0 auto}
.top button{font:inherit;font-size:.95rem;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:.3rem .6rem;cursor:pointer}
.top button[aria-pressed="true"]{color:var(--ink);border-color:var(--seal)}
.top button:focus-visible,.ln:focus-visible{outline:2px solid var(--seal);outline-offset:3px}
.hero{display:grid;gap:2.5rem;max-width:1080px;margin:0 auto;padding:2rem 1.25rem 3.5rem}
@media(min-width:860px){.hero{grid-template-columns:1.1fr .9fr;align-items:center;padding-top:3.5rem}}
h1{font-size:clamp(2.7rem,8vw,5rem);line-height:1.02;margin:0 0 1rem;font-weight:700;letter-spacing:-.015em}
.sub{margin:0;color:var(--mute);font-style:italic;font-size:1.15rem}
.sub b{display:block;font-style:normal;color:var(--ink);font-weight:400;margin-bottom:.2rem}
.stanza{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1.25rem 1.25rem 1rem}
.lines{display:grid;gap:.35rem}
.ln{display:flex;align-items:center;gap:.75rem;background:none;border:0;padding:.1rem 0;cursor:pointer;color:inherit;font:inherit;text-align:left;transition:opacity .2s}
.ln .l{width:1.2rem;font-weight:700;color:var(--c)}
.ln i{display:block;height:.7rem;border-radius:2px;background:var(--c);transform-origin:left;animation:grow .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n)*70ms)}
.lines.sel .ln{opacity:.22}
.lines.sel .ln.on{opacity:1}
.cap{margin:1rem 0 0;font-size:.9rem;color:var(--mute);line-height:1.55}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
main{max-width:720px;margin:0 auto;padding:0 1.25rem 4rem}
@media(min-width:860px){main{margin-left:max(1.25rem,calc((100vw - 1080px)/2 + 1.25rem))}}
section{padding-top:2.5rem;border-top:1px solid var(--line);margin-top:2.5rem}
h2{font-size:1.7rem;line-height:1.2;margin:0 0 1rem}
p{margin:0 0 1rem}
ol.ch{list-style:none;counter-reset:c;padding:0;margin:0}
ol.ch li{counter-increment:c;position:relative;padding:0 0 1rem 3rem}
ol.ch li::before{content:counter(c);position:absolute;left:0;top:0;width:2rem;height:2rem;border:1px solid var(--seal);border-radius:50%;display:grid;place-items:center;color:var(--seal);font-size:.9rem;line-height:1}
dl{margin:0}
dt{font-weight:700;margin-top:1rem}
dd{margin:0;color:var(--mute)}
ul.dates{list-style:none;padding:0;margin:0}
ul.dates li{display:flex;gap:1.25rem;padding:.35rem 0;border-bottom:1px solid var(--line)}
ul.dates b{min-width:3.5rem;color:var(--seal)}
footer{max-width:720px;margin:0 auto;padding:0 1.25rem 3rem;color:var(--mute);font-size:.9rem}
@media(min-width:860px){footer{margin-left:max(1.25rem,calc((100vw - 1080px)/2 + 1.25rem))}}
@media(prefers-reduced-motion:reduce){.ln i{animation:none}html{scroll-behavior:auto}}

.top{position:sticky;top:0;z-index:5;max-width:none;padding:.6rem max(1.25rem,calc((100vw - 1080px)/2 + 1.25rem));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px)}
.hero{padding-bottom:4.5rem}
.cta{display:inline-block;margin-top:1.75rem;background:var(--seal);color:var(--bg);padding:.8rem 1.5rem;border-radius:999px;text-decoration:none;font-weight:700}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.portrait{position:relative;margin:0;justify-self:center;width:min(86%,380px)}
.portrait::before{content:"";position:absolute;inset:1.2rem -1.2rem -1.2rem 1.2rem;border:2px solid var(--seal);border-radius:999px 999px 14px 14px}
.portrait img{position:relative;display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 18%;border-radius:999px 999px 14px 14px;background:#EFE6D2}
.portrait figcaption{position:relative;margin-top:.6rem;font-size:.85rem;color:var(--mute);font-style:italic}
.themes{display:grid;gap:1rem}
.themes article{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.3rem}
.themes h3{margin:0 0 .35rem;font-size:1.15rem;color:var(--seal)}
.themes p{margin:0;color:var(--mute)}

.voice-box{max-width:1080px;margin:0 auto;padding:0 1.25rem 1rem}
.voice-panel{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem}
.voice-panel p{flex:1 1 100%;margin:0;color:var(--mute);font-size:.95rem}
.voice-panel button{font:inherit;border:0;border-radius:999px;padding:.65rem 1rem;cursor:pointer;background:var(--seal);color:var(--bg)}
.voice-panel button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.voice-status{font-size:.85rem;color:var(--mute);min-width:100%}

</style>
</head>

<nav class="top" aria-label="Language">

<main>

    </div>
  </section>

  <section id="story">
    <h2 data-t="story_h"></h2>
    <ol class="ch" id="chapters"></ol>
  </section>

  <section>
    <h2 data-t="themes_h"></h2>
    <div class="themes" id="themes"></div>
  </section>

  <section>
    <h2 data-t="chars_h"></h2>

  </section>

  <section>
    <h2 data-t="abai_h"></h2>
    <p data-t="abai_p"></p>
  </section>

  <section>

    <ul class="dates" id="dates"></ul>
  </section>
</main>
<footer data-t="foot"></footer>

const SCHEME = "AbAbCCddEffEgg".split("");
const COLORS = {a:"--ra",b:"--rb",c:"--rc",d:"--rd",e:"--re",f:"--rf",g:"--rg"};

const linesEl = document.getElementById("lines");
SCHEME.forEach((ch,i)=>{
  const k = ch.toLowerCase();
  const b = document.createElement("button");
  b.className = "ln"; b.type = "button"; b.dataset.r = k;
  b.setAttribute("aria-pressed","false");
  b.style.setProperty("--c",`var(${COLORS[k]})`);
  b.style.setProperty("--n",i);
  b.innerHTML = `<span class="l">${ch}</span><i style="width:${ch===ch.toUpperCase()?100:90}%"></i>`;
  b.addEventListener("click",()=>pick(k));
  linesEl.appendChild(b);
});
let current = null;
function pick(k){
  current = current===k ? null : k;
  linesEl.classList.toggle("sel",!!current);
  linesEl.querySelectorAll(".ln").forEach(el=>{
    const on = el.dataset.r===current;
    el.classList.toggle("on",on);
    el.setAttribute("aria-pressed",on);
  });
}

let activeLang = "kk";
function setLang(l){
  const t = T[l] || T.kk;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  activeLang = l;
  document.getElementById("voiceStatus").textContent = "";
  document.documentElement.lang = l;
  document.title = t.title + " — " + t.author;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t[el.dataset.t]; });
  document.getElementById("chapters").innerHTML = t.ch.map(s=>`<li>${s}</li>`).join("");
  document.getElementById("themes").innerHTML = t.themes.map(c=>`<article><h3>${c[0]}</h3><p>${c[1]}</p></article>`).join("");
  document.querySelector(".portrait img").alt = t.img_cap;
  document.getElementById("chars").innerHTML = t.chars.map(c=>`<dt>${c[0]}</dt><dd>${c[1]}</dd>`).join("");
  document.getElementById("dates").innerHTML = t.dates.map(d=>`<li><b>${d[0]}</b><span>${d[1]}</span></li>`).join("");
  document.querySelectorAll(".top button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===l));
  try{ localStorage.setItem("onegin-lang", l); }catch(e){}
}
document.querySelectorAll(".top button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

let start = "kk";
try{
  const saved = localStorage.getItem("onegin-lang");
  if(saved && T[saved]) start = saved;
  else { const n = (navigator.language||"").slice(0,2); if(T[n]) start = n; }
}catch(e){}

setLang(start);

const speakBtn = document.getElementById("speak");
const pauseBtn = document.getElementById("pause");
const stopBtn = document.getElementById("stop");
const voiceStatus = document.getElementById("voiceStatus");

const AUDIO = { kk:"audio/onegin-kk.mp3", ru:"audio/onegin-ru.mp3", en:"audio/onegin-en.mp3" };
const MSG = {
  kk:{start:"Таныстыру басталды...", end:"Таныстыру аяқталды.", err:"Дыбыстау іске қосылмады."},
  ru:{start:"Воспроизведение началось...", end:"Воспроизведение завершено.", err:"Не удалось включить озвучивание."},
  en:{start:"Introduction started...", end:"Introduction finished.", err:"Speech could not be started."}
};
const player = new Audio();
player.preload = "none";

function stopAll(){
  player.pause();
  player.currentTime = 0;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
// language switch must also stop the sound
document.querySelectorAll(".top button").forEach(b=>b.addEventListener("click", stopAll));

player.addEventListener("ended", () => { voiceStatus.textContent = MSG[activeLang].end; });

function speakFallback(){
  if (!("speechSynthesis" in window)) { voiceStatus.textContent = MSG[activeLang].err; return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(T[activeLang].narration);
  u.lang = activeLang === "kk" ? "kk-KZ" : activeLang === "ru" ? "ru-RU" : "en-US";
  u.rate = 0.9;
  u.onstart = () => { voiceStatus.textContent = MSG[activeLang].start; };
  u.onend = () => { voiceStatus.textContent = MSG[activeLang].end; };
  u.onerror = () => { voiceStatus.textContent = MSG[activeLang].err; };
  speechSynthesis.speak(u);
}

speakBtn.addEventListener("click", () => {
  stopAll();
  player.src = AUDIO[activeLang];
  player.play().then(() => {
    voiceStatus.textContent = MSG[activeLang].start;
  }).catch(speakFallback);
});
pauseBtn.addEventListener("click", () => {
  if (player.src && !player.paused) player.pause();
  else if (player.src && player.paused && player.currentTime > 0 && !player.ended) player.play();
});
stopBtn.addEventListener("click", () => { stopAll(); voiceStatus.textContent = ""; });
</script>
